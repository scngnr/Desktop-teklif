<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desktop Teklif</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <header class="titlebar" id="titlebar">
      <div class="titlebar-drag">
        <button type="button" class="sidebar-toggle" id="btnSidebarToggle" title="Menüyü daralt/genişlet" aria-label="Menüyü daralt">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <path d="M2 3.5h10M2 7h10M2 10.5h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
        <span class="titlebar-brand" id="titlebarBrand">Desktop Teklif</span>
      </div>
      <div class="window-controls">
        <button type="button" class="win-btn win-min" id="btnMinimize" title="Küçült" aria-label="Küçült">
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="5.5" width="10" height="1.2" fill="currentColor"/></svg>
        </button>
        <button type="button" class="win-btn win-close" id="btnClose" title="Kapat" aria-label="Kapat">
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.2 2.2l7.6 7.6M9.8 2.2L2.2 9.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div class="layout" id="layout">
      <aside class="sidebar" id="sidebar">
        <div class="user-card">
          <div class="user-avatar" id="userAvatar">?</div>
          <div class="user-meta">
            <p class="user-name" id="userName">Yükleniyor…</p>
            <p class="user-role" id="userRole">API kullanıcısı</p>
          </div>
        </div>

        <nav class="nav" aria-label="Ana menü" id="mainNav">
          <p class="nav-section-label">Uygulama</p>
          <button type="button" class="nav-action-btn" id="btnCreateTeklif" title="Yeni Teklif Oluştur">
            <span class="nav-icon" aria-hidden="true">◇</span>
            <span class="nav-label">Yeni Teklif</span>
          </button>
          <button type="button" class="nav-item" data-view="ayarlar" title="Ayarlar">
            <span class="nav-icon" aria-hidden="true">⚙</span>
            <span class="nav-label">Ayarlar</span>
          </button>

          <p class="nav-section-label">Web (MRP)</p>
          <button type="button" class="nav-item" data-view="web" data-path="" title="Panel">
            <span class="nav-icon" aria-hidden="true">▣</span>
            <span class="nav-label">Panel</span>
          </button>
        </nav>
      </aside>

      <main class="content" id="content">
        <section class="view" id="view-ayarlar" hidden>
          <header class="page-header">
            <h1>Ayarlar</h1>
          </header>

          <form class="settings-form" id="settingsForm">
            <label class="field">
              <span class="field-label">Base URL (site adı)</span>
              <input type="url" id="inputBaseUrl" name="baseUrl" placeholder="https://mrp.cangungor.tr" autocomplete="off" spellcheck="false" required />
            </label>

            <label class="field">
              <span class="field-label">Firma adı</span>
              <input type="text" id="inputFirmaAdi" name="firmaAdi" placeholder="ornekfirma" autocomplete="off" spellcheck="false" />
            </label>

            <p class="field-hint" id="girisUrlPreview">Giriş URL: —</p>

            <label class="field">
              <span class="field-label">JWT Token</span>
              <input type="password" id="inputJwt" name="authToken" placeholder="JWT token" autocomplete="off" spellcheck="false" required />
            </label>

            <label class="show-jwt">
              <input type="checkbox" id="toggleJwtVisible" />
              <span>Token’ı göster</span>
            </label>

            <div class="settings-actions">
              <button type="submit" class="btn-primary" id="btnSaveSettings">Kaydet</button>
            </div>
          </form>
        </section>

        <section class="view view-web" id="view-web">
          <webview
            id="pageWebview"
            class="page-webview"
            partition="persist:mrp"
            allowpopups
          ></webview>
        </section>
      </main>
    </div>
  </div>

  <button type="button" class="fab-teklif" id="btnCreateTeklifFab" title="Yeni Teklif Oluştur" hidden>
    <span class="fab-icon" aria-hidden="true">◇</span>
    <span class="fab-label">Yeni Teklif</span>
  </button>

  <div class="toast-host" id="toastHost" aria-live="polite" aria-relevant="additions"></div>
  <script src="renderer.js"></script>
</body>
</html>
