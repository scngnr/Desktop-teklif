<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Yeni Teklif</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", "Candara", system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    .wrap {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
      height: 100%;
      padding: 8px;
      box-sizing: border-box;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      padding: 12px 18px;
      border: none;
      border-radius: 999px;
      background: #1f6feb;
      color: #fff;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 650;
      letter-spacing: 0.01em;
      cursor: pointer;
      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(31, 111, 235, 0.35);
      transition: transform 0.12s ease, background 0.12s ease, opacity 0.12s ease;
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      background: #388bfd;
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .icon {
      font-size: 1.05rem;
      line-height: 1;
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <button type="button" id="btnFab" title="Yeni Teklif Oluştur">
      <span class="icon" aria-hidden="true">◇</span>
      <span id="label">Yeni Teklif</span>
    </button>
  </div>
  <script src="fab.js"></script>
</body>
</html>
